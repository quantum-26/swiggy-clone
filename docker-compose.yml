# version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swiggy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiggy
      POSTGRES_PASSWORD: swiggy_dev_pw
      POSTGRES_DB: swiggy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiggy -d swiggy_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiggy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./services/user-service
      target: development
    container_name: swiggy-user-service
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://swiggy:swiggy_dev_pw@postgres:5432/swiggy_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
# version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swiggy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiggy
      POSTGRES_PASSWORD: swiggy_dev_pw
      POSTGRES_DB: swiggy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiggy -d swiggy_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swiggy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./services/api-gateway
      target: development
    container_name: swiggy-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      USER_SERVICE_URL: http://user-service:4000
      JWT_ACCESS_SECRET: 8f3a1e6c9b2d4f7a0e5c8b1d3f6a9e2c7b0d4f8a1e3c6b9d2f5a8e1c4b7d0f3a
    depends_on:
      - user-service
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    command: npm run dev
  
  user-service:
    build:
      context: ./services/user-service
      target: development
    container_name: swiggy-user-service
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://swiggy:swiggy_dev_pw@postgres:5432/swiggy_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: 8f3a1e6c9b2d4f7a0e5c8b1d3f6a9e2c7b0d4f8a1e3c6b9d2f5a8e1c4b7d0f3a
      JWT_REFRESH_SECRET: 2c5f8a1e4b7d0f3a6c9e2b5d8f1a4e7c0b3d6f9a2e5c8b1d4f7a0e3c6b9d2f5a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data: